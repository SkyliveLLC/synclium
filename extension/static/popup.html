<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synclium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <main id="main">
    <p class="eyebrow">Synclium</p>
    <p class="lead"><span class="dot" aria-hidden="true"></span><span id="status">&nbsp;</span></p>
    <div class="actions">
      <button id="sync" class="primary">Sync now</button>
      <button id="action" hidden></button>
      <button id="open" class="quiet">Open</button>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
